spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billing_db}
    username: ${SPRING_DATASOURCE_USERNAME:billing}
    password: ${SPRING_DATASOURCE_PASSWORD:billing}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true